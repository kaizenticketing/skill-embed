name: Sync agents

# once a week: regenerate the agent table from the newest release of vercel-labs/skills, and open a pull request when
# a row changed. it needs, once: Settings > Actions > General > "Allow GitHub Actions to create and approve pull
# requests"
#
# the generator RUNS the upstream table, so it is in a job of its own that holds no write token. the job that opens
# the pull request only carries the two generated files across
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-agents
  cancel-in-progress: false

jobs:
  generate:
    name: Generate the table
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.upstream.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Fetch the newest release of vercel-labs/skills
        id: upstream
        run: |
          tag=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/vercel-labs/skills 'v[0-9]*' | head -n 1 | sed 's|.*refs/tags/||')
          if [ -z "$tag" ]; then
            echo "::error::vercel-labs/skills has no release tag."
            exit 1
          fi
          git clone --quiet --depth 1 --branch "$tag" https://github.com/vercel-labs/skills "$RUNNER_TEMP/upstream"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Generate
        run: node --disable-warning=ExperimentalWarning scripts/generate-agents.mjs "$RUNNER_TEMP/upstream"

      - name: See whether a row changed
        id: diff
        run: |
          if git diff --quiet -- src/KaizenTicketing.SkillEmbed/Agents/agents.json docs/supported-agents.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      # a pull request this workflow opens does not start CI, so the table is tested here
      - name: Test the new table
        if: steps.diff.outputs.changed == 'true'
        run: dotnet test KaizenTicketing.SkillEmbed.slnx --configuration Release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: agents
          path: |
            src/KaizenTicketing.SkillEmbed/Agents/agents.json
            docs/supported-agents.md
          if-no-files-found: error

  pull-request:
    name: Open the pull request
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.generate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stop when this release already has a pull request
        id: existing
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "sync-agents/$VERSION" > /dev/null; then
            echo "sync-agents/$VERSION is already there."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.existing.outputs.exists == 'false'
        with:
          name: agents

      - name: Open the pull request
        if: steps.existing.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "sync-agents/$VERSION"
          git add src/KaizenTicketing.SkillEmbed/Agents/agents.json docs/supported-agents.md
          git commit --quiet -m "Sync The Agent Table With vercel-labs/skills $VERSION"
          git push --quiet origin "sync-agents/$VERSION"
          gh pr create \
            --base main \
            --head "sync-agents/$VERSION" \
            --title "Sync The Agent Table With vercel-labs/skills $VERSION" \
            --body "The agent table, generated by \`scripts/generate-agents.mjs\` from [vercel-labs/skills](https://github.com/vercel-labs/skills) $VERSION. The tests passed against it in the run that opened this.

          A pull request a workflow opens does not start CI. Close and reopen this one to run it."
